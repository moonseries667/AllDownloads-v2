# Run with --spring.config.additional-location=./application.local.properties
# Paths refer to the machine running this application; use isolated paths on Carbon.
server.address=127.0.0.1
server.port=8080
alldownloads.database=runtime/control/business.db
alldownloads.runner-token-file=runtime/auth/runner.token
# Set an existing local directory also allowed by the Go runner.
alldownloads.download-root=
# Optional, exact local frontend origins, comma separated; no wildcard.
alldownloads.allowed-origins=
# Optional, existing production frontend dist directory; empty disables static serving.
alldownloads.frontend-root=
